resources:
  jobs:
    order_pipeline_job:
      name: "Order Pipeline Batch Job"
      schedule:
        quartz_cron_expression: "0 0/5 * * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED

      environments:
        - environment_key: default
          spec:
            client: "4"
            java_dependencies:
              - /Volumes/workspace/sales/artifacts/orderpipeline-0.0.1-SNAPSHOT.jar

      tasks:
        - task_key: ingest_bronze
          environment_key: default
          spark_jar_task:
            main_class_name: com.company.orderpipeline.OrderPipelineApplication
            parameters:
              - "bronze"
              - "--spring.profiles.active=prod"
              - "--pipeline.production.mode=true"
              - "--pipeline.alert.rescued-record-threshold=50"
              - "--pipeline.contract.require-updated-at=${var.contract_require_updated_at}"
              - "--pipeline.contract.require-event-version=${var.contract_require_event_version}"
              - "--pipeline.maintenance.audit.table=${var.maintenance_audit_table}"
              - "--pipeline.maintenance.alert.on-failure=${var.maintenance_alert_on_failure}"
              - "--pipeline.stage.audit.table=${var.stage_audit_table}"
              - "--pipeline.stage.alert.on-anomaly=${var.stage_alert_on_anomaly}"
              - "--pipeline.stage.alert.min-output-ratio=${var.stage_alert_min_output_ratio}"
              - "--pipeline.stage.alert.max-rejected-count=${var.stage_alert_max_rejected_count}"

        - task_key: process_silver
          depends_on:
            - task_key: ingest_bronze
          environment_key: default
          spark_jar_task:
            main_class_name: com.company.orderpipeline.OrderPipelineApplication
            parameters:
              - "silver"
              - "--spring.profiles.active=prod"
              - "--pipeline.production.mode=true"
              - "--pipeline.alert.rescued-record-threshold=50"
              - "--pipeline.contract.require-updated-at=${var.contract_require_updated_at}"
              - "--pipeline.contract.require-event-version=${var.contract_require_event_version}"
              - "--pipeline.maintenance.audit.table=${var.maintenance_audit_table}"
              - "--pipeline.maintenance.alert.on-failure=${var.maintenance_alert_on_failure}"
              - "--pipeline.stage.audit.table=${var.stage_audit_table}"
              - "--pipeline.stage.alert.on-anomaly=${var.stage_alert_on_anomaly}"
              - "--pipeline.stage.alert.min-output-ratio=${var.stage_alert_min_output_ratio}"
              - "--pipeline.stage.alert.max-rejected-count=${var.stage_alert_max_rejected_count}"

        - task_key: aggregate_gold
          depends_on:
            - task_key: process_silver
          environment_key: default
          spark_jar_task:
            main_class_name: com.company.orderpipeline.OrderPipelineApplication
            parameters:
              - "gold"
              - "--spring.profiles.active=prod"
              - "--pipeline.production.mode=true"
              - "--pipeline.alert.rescued-record-threshold=50"
              - "--pipeline.contract.require-updated-at=${var.contract_require_updated_at}"
              - "--pipeline.contract.require-event-version=${var.contract_require_event_version}"
              - "--pipeline.maintenance.audit.table=${var.maintenance_audit_table}"
              - "--pipeline.maintenance.alert.on-failure=${var.maintenance_alert_on_failure}"
              - "--pipeline.stage.audit.table=${var.stage_audit_table}"
              - "--pipeline.stage.alert.on-anomaly=${var.stage_alert_on_anomaly}"
              - "--pipeline.stage.alert.min-output-ratio=${var.stage_alert_min_output_ratio}"
              - "--pipeline.stage.alert.max-rejected-count=${var.stage_alert_max_rejected_count}"

    order_pipeline_maintenance_job:
      name: "Order Pipeline Maintenance Job"
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED

      environments:
        - environment_key: default
          spec:
            client: "4"
            java_dependencies:
              - /Volumes/workspace/sales/artifacts/orderpipeline-0.0.1-SNAPSHOT.jar

      tasks:
        - task_key: run_maintenance
          environment_key: default
          spark_jar_task:
            main_class_name: com.company.orderpipeline.OrderPipelineApplication
            parameters:
              - "maintenance"
              - "--spring.profiles.active=prod"
              - "--pipeline.production.mode=true"
              - "--pipeline.maintenance.audit.table=${var.maintenance_audit_table}"
              - "--pipeline.maintenance.alert.on-failure=${var.maintenance_alert_on_failure}"
              - "--pipeline.maintenance.vacuum-retention-hours=${var.maintenance_vacuum_retention_hours}"
              - "--pipeline.maintenance.audit-replay-required=${var.maintenance_audit_replay_required}"
              - "--pipeline.maintenance.slow-downstream-max-lag-hours=${var.maintenance_slow_downstream_max_lag_hours}"
